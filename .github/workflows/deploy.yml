name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Pull latest code
        run: |
          cd /var/www/blacklist
          git pull

      - name: Install PHP dependencies
        run: docker exec blacklist-app composer install --no-interaction --prefer-dist --optimize-autoloader --no-dev

      - name: Run migrations
        run: docker exec blacklist-app php bin/console doctrine:migrations:migrate --no-interaction --allow-no-migration

      - name: Clear and warm up cache
        run: docker exec blacklist-app php bin/console cache:clear --no-interaction

      # up -d, not restart: creates anything newly added to docker-compose.yml and
      # leaves already-running, unchanged containers alone.
      - name: Restart services
        run: |
          cd /var/www/blacklist
          docker compose --env-file .env.local up -d --build

      - name: Done
        run: echo "✅ Deploy done"
