# Local PHP 8.4 (Apache) + MariaDB environment for blacklist.localhost.
# Bring your own Symfony project — drop it into this directory; public/index.php
# is served as the front controller and DATABASE_URL is already wired.
#
# Routing: the shared `nginx-proxy` container (see ~/PhpstormProjects/multisite/nginx-proxy)
# discovers this app by its VIRTUAL_HOST env var and serves it on http://blacklist.localhost/
#
# Values (APP_PORT, VIRTUAL_HOST, DB_*, MYSQL_IMAGE...) come from .env, which
# docker compose auto-loads from this directory.
services:
    blacklist-mysql:
        image: ${MYSQL_IMAGE:-mariadb:11.4}
        container_name: ${CONTAINER_PREFIX:-blacklist.localhost}-mysql
        restart: unless-stopped
        environment:
            MYSQL_DATABASE: ${DB_DATABASE:-blacklist}
            MYSQL_USER: ${DB_USERNAME:-blacklist}
            MYSQL_PASSWORD: ${DB_PASSWORD:-blacklist}
            MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
        volumes:
            - blacklist_mysql_data:/var/lib/mysql
        ports:
            - "127.0.0.1:${DB_PORT_HOST:-13307}:3306"
        networks:
            - multisite-network
        healthcheck:
            test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
            interval: 5s
            timeout: 5s
            retries: 20
            start_period: 45s

    blacklist-app:
        build:
            context: .
            dockerfile: Dockerfile
            args:
                UID: "${UID:-1000}"
                GID: "${GID:-1000}"
        container_name: ${CONTAINER_PREFIX:-blacklist.localhost}-app
        restart: unless-stopped
        expose:
            - "80"
        ports:
            - "${APP_PORT:-8096}:80"
        volumes:
            - .:/var/www/html
        networks:
            - multisite-network
        depends_on:
            blacklist-mysql:
                condition: service_healthy
        environment:
            # nginx-proxy discovery
            VIRTUAL_HOST: ${VIRTUAL_HOST:-blacklist.localhost}
            VIRTUAL_PORT: "80"
            APP_ENV: ${APP_ENV:-dev}
            APP_DEBUG: ${APP_DEBUG:-1}
            # Inside the compose network the DB is always the service name on 3306,
            # regardless of the host-facing DATABASE_URL in .env.
            DATABASE_URL: "mysql://${DB_USERNAME:-blacklist}:${DB_PASSWORD:-blacklist}@blacklist-mysql:3306/${DB_DATABASE:-blacklist}?serverVersion=${DB_SERVER_VERSION:-11.4.13-MariaDB}&charset=utf8mb4"

volumes:
    blacklist_mysql_data:

networks:
    multisite-network:
        external: true
